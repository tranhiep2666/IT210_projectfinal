<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctor Profile</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background:#eef1f8;
            min-height:100vh;
        }

        .dashboard{
            display:flex;
            min-height:100vh;
        }

        /* SIDEBAR */

        .sidebar{
            width:110px;
            background:#bfc8f3;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:space-between;
            padding:30px 0;
            border-radius:0 30px 30px 0;
        }

        .sidebar-top{
            display:flex;
            flex-direction:column;
            gap:30px;
        }

        .logo{
            width:58px;
            height:58px;
            background:#5b47c5;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-size:22px;
            box-shadow:0 10px 20px rgba(91,71,197,0.3);
        }

        .menu-item{
            width:58px;
            height:58px;
            border-radius:18px;
            background:white;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#5b47c5;
            font-size:20px;
            transition:0.3s;
            cursor:pointer;
            text-decoration:none;
        }

        .menu-item.active{
            background:#5b47c5;
            color:white;
            box-shadow:0 10px 20px rgba(91,71,197,0.3);
        }

        .menu-item:hover{
            transform:translateY(-3px);
        }

        /* MAIN */

        .main{
            flex:1;
            padding:40px;
            overflow-y:auto;
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:40px;
        }

        .title h1{
            font-size:42px;
            color:#202020;
        }

        .title p{
            color:#888;
            margin-top:8px;
            font-size:14px;
            letter-spacing:1px;
        }

        .doctor-box{
            background:white;
            padding:15px 25px;
            border-radius:14px;
            box-shadow:0 5px 15px rgba(0,0,0,0.05);
            color:#555;
        }

        /* CONTENT */

        .content{
            display:grid;
            grid-template-columns:320px 1fr;
            gap:30px;
        }

        /* PROFILE CARD */

        .profile-card{
            background:white;
            border-radius:28px;
            padding:35px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.05);
        }

        .avatar{
            width:130px;
            height:130px;
            border-radius:50%;
            margin:auto;
            margin-bottom:25px;
            background-image:url('https://cdn-icons-png.flaticon.com/512/3774/3774299.png');
            background-size:cover;
            background-position:center;
            border:6px solid #eee9ff;
        }

        .profile-card h2{
            color:#222;
            margin-bottom:10px;
        }

        .profile-card p{
            color:#777;
            margin-bottom:8px;
        }

        .badge{
            display:inline-block;
            margin-top:15px;
            background:#eee9ff;
            color:#5b47c5;
            padding:10px 18px;
            border-radius:14px;
            font-size:14px;
            font-weight:600;
        }

        /* FORM CARD */

        .profile-form{
            background:white;
            border-radius:28px;
            padding:40px;
            box-shadow:0 10px 30px rgba(0,0,0,0.05);
        }

        .profile-form h2{
            color:#222;
            margin-bottom:30px;
            font-size:28px;
        }

        .row{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;
        }

        .form-group{
            margin-bottom:22px;
        }

        label{
            display:block;
            margin-bottom:10px;
            color:#444;
            font-weight:600;
        }

        input,
        textarea{
            width:100%;
            padding:15px;
            border-radius:16px;
            border:1px solid #ddd;
            font-size:15px;
            outline:none;
            transition:0.3s;
        }

        input:focus,
        textarea:focus{
            border-color:#5b47c5;
            box-shadow:0 0 0 4px rgba(91,71,197,0.1);
        }

        textarea{
            resize:none;
            min-height:120px;
        }

        .readonly{
            background:#f7f8fc;
            color:#777;
        }

        .btn{
            margin-top:10px;
            border:none;
            background:#5b47c5;
            color:white;
            padding:16px 30px;
            border-radius:18px;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
            box-shadow:0 10px 20px rgba(91,71,197,0.25);
        }

        .btn:hover{
            background:#4837a7;
            transform:translateY(-2px);
        }

        /* RESPONSIVE */

        @media(max-width:1000px){

            .content{
                grid-template-columns:1fr;
            }

        }

        @media(max-width:750px){

            .dashboard{
                flex-direction:column;
            }

            .sidebar{
                width:100%;
                height:90px;
                flex-direction:row;
                border-radius:0;
                padding:0 20px;
            }

            .sidebar-top{
                flex-direction:row;
            }

            .main{
                padding:20px;
            }

            .row{
                grid-template-columns:1fr;
            }

        }

    </style>

</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="sidebar-top">

            <div class="logo">
                <i class="fa-solid fa-user-doctor"></i>
            </div>

            <a href="/doctor/dashboard"
               class="menu-item">

                <i class="fa-solid fa-chart-line"></i>

            </a>

            <a href="/doctor/profile"
               class="menu-item active">

                <i class="fa-solid fa-user-doctor"></i>

            </a>

        </div>

        <a href="/logout"
           class="menu-item">

            <i class="fa-solid fa-power-off"></i>

        </a>

    </div>

    <!-- MAIN -->

    <div class="main">

        <div class="top-bar">

            <div class="title">

                <h1>
                    Doctor Profile
                </h1>

                <p>
                    SMART HEALTHCARE SYSTEM
                </p>

            </div>

            <div class="doctor-box">
                Doctor Panel
            </div>

        </div>

        <!-- CONTENT -->

        <div class="content">

            <!-- PROFILE CARD -->

            <div class="profile-card">

                <div class="avatar"></div>

                <h2 th:text="${doctor.fullName}">
                    Dr. John Doe
                </h2>

                <p th:text="${doctor.user.email}">
                    doctor@gmail.com
                </p>

                <p>

                    <i class="fa-solid fa-stethoscope"></i>

                    <span th:text="${doctor.specialty.name}">
                        Cardiology
                    </span>

                </p>

                <div class="badge">
                    Doctor Account
                </div>

            </div>

            <!-- PROFILE FORM -->

            <div class="profile-form">

                <h2>
                    Professional Information
                </h2>

                <form th:action="@{/doctor/profile/update}"
                      method="post"
                      th:object="${doctor}">

                    <input type="hidden"
                           th:field="*{id}">

                    <div class="row">

                        <div class="form-group">

                            <label>
                                Full Name
                            </label>

                            <input type="text"
                                   th:field="*{fullName}">

                        </div>

                        <div class="form-group">

                            <label>
                                Phone Number
                            </label>

                            <input type="text"
                                   th:field="*{phone}">

                        </div>

                    </div>

                    <div class="row">

                        <div class="form-group">

                            <label>
                                Specialty
                            </label>

                            <input type="text"
                                   class="readonly"
                                   th:value="${doctor.specialty.name}"
                                   readonly>

                        </div>

                        <div class="form-group">

                            <label>
                                Experience (Years)
                            </label>

                            <input type="number"
                                   th:field="*{experienceYears}">

                        </div>

                    </div>

                    <div class="form-group">

                        <label>
                            Qualification
                        </label>

                        <input type="text"
                               th:field="*{qualification}"
                               placeholder="MBBS, MD, PhD...">

                    </div>

                    <button type="submit"
                            class="btn">

                        <i class="fa-solid fa-floppy-disk"></i>

                        Update Profile

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
