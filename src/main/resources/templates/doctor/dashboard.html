<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctor Dashboard</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background:#eef1f8;
            height:100vh;
            overflow:hidden;
        }

        .dashboard{
            display:flex;
            height:100vh;
        }

        /* SIDEBAR */

        .sidebar{
            width:110px;
            background:#bfc8f3;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:space-between;
            padding:30px 0;
            border-radius:0 30px 30px 0;
        }

        .sidebar-top{
            display:flex;
            flex-direction:column;
            gap:30px;
        }

        .logo{
            width:58px;
            height:58px;
            background:#5b47c5;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-size:22px;
            box-shadow:0 10px 20px rgba(91,71,197,0.3);
        }

        .menu-item{
            width:58px;
            height:58px;
            border-radius:18px;
            background:white;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#5b47c5;
            font-size:20px;
            transition:0.3s;
            cursor:pointer;
            text-decoration:none;
        }

        .menu-item.active{
            background:#5b47c5;
            color:white;
            box-shadow:0 10px 20px rgba(91,71,197,0.3);
        }

        .menu-item:hover{
            transform:translateY(-3px);
        }

        /* MAIN */

        .main{
            flex:1;
            padding:40px;
            overflow-y:auto;
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:40px;
        }

        .title h1{
            font-size:42px;
            color:#202020;
        }

        .title p{
            color:#888;
            margin-top:8px;
            font-size:14px;
            letter-spacing:1px;
        }

        .doctor-box{
            background:white;
            padding:15px 25px;
            border-radius:14px;
            box-shadow:0 5px 15px rgba(0,0,0,0.05);
            color:#555;
        }

        /* CARD */

        .card{
            background:white;
            padding:30px;
            border-radius:24px;
            box-shadow:0 10px 30px rgba(0,0,0,0.05);
        }

        .card-title{
            display:flex;
            align-items:center;
            gap:15px;
            margin-bottom:25px;
        }

        .card-icon{
            width:55px;
            height:55px;
            border-radius:16px;
            background:#eee9ff;
            color:#5b47c5;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:22px;
        }

        .card-title h2{
            color:#222;
            font-size:28px;
        }

        /* TABLE */

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:#f4f2ff;
            color:#5b47c5;
            font-weight:600;
        }

        th, td{
            padding:18px;
            text-align:center;
            border-bottom:1px solid #eee;
        }

        tr:hover{
            background:#fafaff;
        }

        /* BUTTON */

        .btn{
            background:#5b47c5;
            color:white;
            text-decoration:none;
            padding:12px 18px;
            border-radius:12px;
            display:inline-flex;
            align-items:center;
            gap:8px;
            font-size:14px;
            transition:0.3s;
            box-shadow:0 8px 20px rgba(91,71,197,0.2);
        }

        .btn:hover{
            background:#4837a7;
            transform:translateY(-2px);
        }

        /* RESPONSIVE */

        @media(max-width:900px){

            .dashboard{
                flex-direction:column;
            }

            .sidebar{
                width:100%;
                height:90px;
                flex-direction:row;
                border-radius:0;
                padding:0 20px;
            }

            .sidebar-top{
                flex-direction:row;
            }

            .main{
                padding:20px;
            }

            table{
                font-size:14px;
            }

        }

    </style>

</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="sidebar-top">

            <div class="logo">
                <i class="fa-solid fa-user-doctor"></i>
            </div>

            <a href="/doctor/dashboard"
               class="menu-item active">

                <i class="fa-solid fa-chart-line"></i>

            </a>

            <a href="/doctor/profile"

               class="menu-item">

                <i class="fa-solid fa-user-doctor"></i>

            </a>


        </div>

        <a href="/logout"
           class="menu-item">

            <i class="fa-solid fa-power-off"></i>

        </a>

    </div>

    <!-- MAIN -->

    <div class="main">

        <div class="top-bar">

            <div class="title">

                <h1>
                    Doctor Dashboard
                </h1>

                <p>
                    SMART HEALTHCARE SYSTEM
                </p>

            </div>

            <div class="doctor-box">
                Doctor Panel
            </div>

        </div>

        <!-- CARD -->

        <div class="card">

            <div class="card-title">

                <div class="card-icon">
                    <i class="fa-solid fa-user-clock"></i>
                </div>

                <h2>
                    Waiting Patients
                </h2>

            </div>

            <table>

                <tr>
                    <th>Patient</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Action</th>
                </tr>

                <tr th:each="a : ${appointments}">

                    <td th:text="${a.patient.username}">
                    </td>

                    <td th:text="${a.appointmentDate}">
                    </td>

                    <td th:text="${a.appointmentTime}">
                    </td>

                    <td>

                        <a class="btn"
                           th:href="@{'/doctor/examination/' + ${a.id}}">

                            <i class="fa-solid fa-stethoscope"></i>

                            Examine

                        </a>

                    </td>

                </tr>

            </table>

        </div>

    </div>

</div>

</body>
</html>
