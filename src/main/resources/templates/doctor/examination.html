<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Medical Examination</title>

    <style>

        body{
            font-family: Arial;
            padding: 40px;
            background: #f5f7fa;
        }

        .container{
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input,
        textarea,
        select{

            width: 100%;

            padding: 12px;

            margin-top: 10px;
            margin-bottom: 20px;
        }

        button{
            padding: 12px 25px;
            background: #0077b6;
            color: white;
            border: none;
            border-radius: 5px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        Medical Examination
    </h1>

    <form th:action="@{/doctor/examine}"
          method="post">

        <input type="hidden"
               name="appointmentId"
               th:value="${appointmentId}">

        <label>
            Triệu chứng
        </label>

        <textarea name="symptoms"></textarea>

        <label>
            Chẩn đoán
        </label>

        <textarea name="diagnosis"></textarea>

        <label>
            Ghi chú
        </label>

        <textarea name="notes"></textarea>

        <h3>
            Thuốc
        </h3>

        <select name="medicines[0].medicineId">

            <option
                    th:each="m : ${medicines}"
                    th:value="${m.id}"
                    th:text="${m.name}">
            </option>

        </select>

        <input type="number"
               name="medicines[0].quantity"
               placeholder="Số lượng">

        <input type="text"
               name="medicines[0].dosage"
               placeholder="Liều lượng">

        <input type="text"
               name="medicines[0].instructions"
               placeholder="Hướng dẫn">

        <button type="submit">

            Save Examination

        </button>

    </form>

</div>

</body>
</html>
