<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Medical Examination</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background:#eef1f8;
            min-height:100vh;
        }

        .dashboard{
            display:flex;
            min-height:100vh;
        }

        /* SIDEBAR */

        .sidebar{
            width:110px;
            background:#bfc8f3;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:space-between;
            padding:30px 0;
            border-radius:0 30px 30px 0;
        }

        .sidebar-top{
            display:flex;
            flex-direction:column;
            gap:30px;
        }

        .logo{
            width:58px;
            height:58px;
            background:#5b47c5;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-size:22px;
            box-shadow:0 10px 20px rgba(91,71,197,0.3);
        }

        .menu-item{
            width:58px;
            height:58px;
            border-radius:18px;
            background:white;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#5b47c5;
            font-size:20px;
            transition:0.3s;
            cursor:pointer;
            text-decoration:none;
        }

        .menu-item.active{
            background:#5b47c5;
            color:white;
            box-shadow:0 10px 20px rgba(91,71,197,0.3);
        }

        /* MAIN */

        .main{
            flex:1;
            padding:40px;
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:35px;
        }

        .title h1{
            font-size:42px;
            color:#202020;
        }

        .title p{
            color:#888;
            margin-top:8px;
            font-size:14px;
            letter-spacing:1px;
        }

        .doctor-box{
            background:white;
            padding:15px 25px;
            border-radius:14px;
            box-shadow:0 5px 15px rgba(0,0,0,0.05);
            color:#555;
        }

        /* FORM CARD */

        .container{
            background:white;
            padding:35px;
            border-radius:24px;
            box-shadow:0 10px 30px rgba(0,0,0,0.05);
        }

        .section-title{
            display:flex;
            align-items:center;
            gap:15px;
            margin-bottom:25px;
        }

        .section-icon{
            width:55px;
            height:55px;
            border-radius:16px;
            background:#eee9ff;
            color:#5b47c5;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:22px;
        }

        .section-title h2{
            font-size:30px;
            color:#222;
        }

        label{
            display:block;
            margin-bottom:10px;
            font-weight:600;
            color:#333;
        }

        textarea,
        input,
        select{
            width:100%;
            padding:14px;
            border-radius:14px;
            border:1px solid #ddd;
            margin-bottom:22px;
            font-size:15px;
            outline:none;
            transition:0.3s;
        }

        textarea{
            min-height:110px;
            resize:vertical;
        }

        textarea:focus,
        input:focus,
        select:focus{
            border-color:#5b47c5;
            box-shadow:0 0 0 4px rgba(91,71,197,0.1);
        }

        /* MEDICINE BOX */

        .medicine-box{
            background:#f8f7ff;
            border:1px solid #ebe7ff;
            padding:25px;
            border-radius:20px;
            margin-bottom:25px;
        }

        .medicine-box h4{
            margin-bottom:20px;
            color:#5b47c5;
        }

        /* BUTTONS */

        .actions{
            display:flex;
            gap:20px;
            margin-top:20px;
        }

        .btn{
            border:none;
            padding:15px 25px;
            border-radius:16px;
            cursor:pointer;
            font-size:15px;
            font-weight:600;
            transition:0.3s;
        }

        .add-btn{
            background:#e9f3ff;
            color:#3498db;
        }

        .add-btn:hover{
            transform:translateY(-2px);
        }

        .submit-btn{
            background:#5b47c5;
            color:white;
            box-shadow:0 10px 20px rgba(91,71,197,0.25);
        }

        .submit-btn:hover{
            background:#4837a7;
            transform:translateY(-2px);
        }

    </style>
</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="sidebar-top">

            <div class="logo">
                <i class="fa-solid fa-user-doctor"></i>
            </div>

            <a href="/doctor/dashboard"
               class="menu-item active">

                <i class="fa-solid fa-stethoscope"></i>

            </a>

        </div>

        <a href="/logout"
           class="menu-item">

            <i class="fa-solid fa-power-off"></i>

        </a>

    </div>

    <!-- MAIN -->

    <div class="main">

        <div class="top-bar">

            <div class="title">

                <h1>
                    Medical Examination
                </h1>

                <p>
                    SMART HEALTHCARE SYSTEM
                </p>

            </div>

            <div class="doctor-box">
                Doctor Panel
            </div>

        </div>

        <!-- FORM -->

        <div class="container">

            <div class="section-title">

                <div class="section-icon">
                    <i class="fa-solid fa-file-medical"></i>
                </div>

                <h2>
                    Examination Form
                </h2>

            </div>

            <form th:action="@{/doctor/examine}"
                  method="post">

                <input type="hidden"
                       name="appointmentId"
                       th:value="${appointmentId}">

                <label>
                    Symptoms
                </label>

                <textarea name="symptoms"></textarea>

                <label>
                    Diagnosis
                </label>

                <textarea name="diagnosis"></textarea>

                <label>
                    Notes
                </label>

                <textarea name="notes"></textarea>

                <!-- MEDICINES -->

                <div id="medicineContainer">

                    <!-- MEDICINE ITEM -->

                    <div class="medicine-box">

                        <h4>
                            Medicine #1
                        </h4>

                        <label>
                            Medicine
                        </label>

                        <select name="medicines[0].medicineId">

                            <option
                                    th:each="m : ${medicines}"
                                    th:value="${m.id}"
                                    th:text="${m.name}">
                            </option>

                        </select>

                        <label>
                            Quantity
                        </label>

                        <input type="number"
                               name="medicines[0].quantity">

                        <label>
                            Dosage
                        </label>

                        <input type="text"
                               name="medicines[0].dosage">

                        <label>
                            Instructions
                        </label>

                        <input type="text"
                               name="medicines[0].instructions">

                    </div>

                </div>

                <div class="actions">

                    <button type="button"
                            class="btn add-btn"
                            onclick="addMedicine()">

                        <i class="fa-solid fa-plus"></i>
                        Add Medicine

                    </button>

                    <button type="submit"
                            class="btn submit-btn">

                        <i class="fa-solid fa-floppy-disk"></i>
                        Save Examination

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script>

    let medicineIndex = 1;

    function addMedicine(){

        const container =
            document.getElementById("medicineContainer");

        const medicinesHtml =
            document.querySelector(".medicine-box")
                .innerHTML;

        const div = document.createElement("div");

        div.classList.add("medicine-box");

        let html = medicinesHtml;

        html = html.replaceAll(
            "medicines[0]",
            "medicines[" + medicineIndex + "]"
        );

        html = html.replace(
            "Medicine #1",
            "Medicine #" + (medicineIndex + 1)
        );

        div.innerHTML = html;

        container.appendChild(div);

        medicineIndex++;
    }

</script>

</body>
</html>
