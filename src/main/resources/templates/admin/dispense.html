<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dispense Medicines</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background:#eef1f8;
            min-height:100vh;
            overflow-x:hidden;
        }

        .dashboard{
            display:flex;
            min-height:100vh;
        }

        /* SIDEBAR */

        .sidebar{
            width:110px;
            background:#bfc8f3;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:space-between;
            padding:30px 0;
            border-radius:0 30px 30px 0;
        }

        .sidebar-top{
            display:flex;
            flex-direction:column;
            gap:30px;
            margin-bottom: 30px;
        }

        .logo{
            width:58px;
            height:58px;
            background:#5b47c5;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-size:22px;
            box-shadow:0 10px 20px rgba(91,71,197,0.3);
        }

        .menu-item{
            width:58px;
            height:58px;
            border-radius:18px;
            background:white;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#5b47c5;
            font-size:20px;
            transition:0.3s;
            cursor:pointer;
            text-decoration:none;
        }

        .menu-item.active{
            background:#5b47c5;
            color:white;
            box-shadow:0 10px 20px rgba(91,71,197,0.3);
        }

        .menu-item:hover{
            transform:translateY(-3px);
        }

        /* MAIN */

        .main{
            flex:1;
            padding:40px;
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:40px;
        }

        .title h1{
            font-size:42px;
            color:#202020;
        }

        .title p{
            color:#888;
            margin-top:8px;
            font-size:14px;
            letter-spacing:1px;
        }

        .admin-box{
            background:white;
            padding:15px 25px;
            border-radius:14px;
            box-shadow:0 5px 15px rgba(0,0,0,0.05);
            color:#555;
        }

        /* PRESCRIPTION CARDS */

        .prescription-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
            gap:25px;
        }

        .prescription-card{
            background:white;
            border-radius:28px;
            padding:30px;
            box-shadow:0 10px 30px rgba(0,0,0,0.05);
            transition:0.3s;
        }

        .prescription-card:hover{
            transform:translateY(-5px);
        }

        .card-top{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:25px;
        }

        .patient-name{
            font-size:22px;
            font-weight:600;
            color:#222;
        }

        .status{
            padding:10px 16px;
            border-radius:12px;
            font-size:13px;
            font-weight:600;
        }

        .waiting{
            background:#fff1e8;
            color:#ff914d;
        }

        .dispensed{
            background:#e6fff1;
            color:#19b36b;
        }

        .section-title{
            margin-bottom:15px;
            color:#5b47c5;
            font-size:16px;
            font-weight:600;
        }

        .medicine-list{
            list-style:none;
            margin-bottom:25px;
        }

        .medicine-item{
            background:#f7f8fc;
            border-radius:16px;
            padding:15px 18px;
            margin-bottom:12px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .medicine-name{
            color:#222;
            font-weight:500;
        }

        .medicine-qty{
            color:#777;
            font-size:14px;
        }

        .dispense-btn{
            width:100%;
            border:none;
            background:#5b47c5;
            color:white;
            padding:16px;
            border-radius:18px;
            font-size:15px;
            font-weight:600;
            text-decoration:none;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            transition:0.3s;
            box-shadow:0 10px 20px rgba(91,71,197,0.25);
        }

        .dispense-btn:hover{
            background:#4837a7;
            transform:translateY(-2px);
        }

        .done-btn{
            width:100%;
            background:#e6fff1;
            color:#19b36b;
            padding:16px;
            border-radius:18px;
            text-align:center;
            font-weight:600;
        }

        /* RESPONSIVE */

        @media(max-width:750px){

            .dashboard{
                flex-direction:column;
            }

            .sidebar{
                width:100%;
                height:90px;
                flex-direction:row;
                border-radius:0;
                padding:0 20px;
            }

            .sidebar-top{
                display:flex;
                flex-direction:column;
                gap:30px;
                margin-bottom: 30px;
            }

            .main{
                padding:20px;
            }

        }

    </style>

</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->

    <div th:replace="~{fragments/admin-sidebar :: adminSidebar('dispense')}">
    </div>

    <!-- MAIN -->

    <div class="main">

        <div class="top-bar">

            <div class="title">

                <h1>
                    Dispense Medicines
                </h1>

                <p>
                    PHARMACY MANAGEMENT SYSTEM
                </p>

            </div>

            <div class="admin-box">
                Admin Panel
            </div>

        </div>

        <!-- PRESCRIPTIONS -->

        <div class="prescription-grid">

            <div class="prescription-card"
                 th:each="p : ${prescriptions}">

                <div class="card-top">

                    <div class="patient-name">

                        <i class="fa-solid fa-user"></i>

                        <span th:text="${p.medicalRecord.appointment.patient.username}">
                        </span>

                    </div>

                    <div class="status"
                         th:classappend="${p.status.name() == 'WAITING_DISPENSE'} ? 'waiting' : 'dispensed'">

                        <span th:text="${p.status}">
                        </span>

                    </div>

                </div>

                <div class="section-title">
                    Medicines
                </div>

                <ul class="medicine-list">

                    <li class="medicine-item"
                        th:each="d : ${p.details}">

                        <div class="medicine-name">

                            <i class="fa-solid fa-pills"></i>

                            <span th:text="${d.medicine.name}">
                            </span>

                        </div>

                        <div class="medicine-qty">

                            Qty:
                            <span th:text="${d.quantity}">
                            </span>

                        </div>

                    </li>

                </ul>

                <a th:if="${p.status.name() == 'WAITING_DISPENSE'}"
                   th:href="@{'/admin/dispense/' + ${p.id}}"
                   class="dispense-btn">

                    <i class="fa-solid fa-box-open"></i>

                    Confirm Dispense

                </a>

                <div th:if="${p.status.name() == 'DISPENSED'}"
                     class="done-btn">

                    <i class="fa-solid fa-circle-check"></i>

                    Already Dispensed

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
