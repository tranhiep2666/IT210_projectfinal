<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{
            background:#eef1f8;
            height:100vh;
            overflow:hidden;
        }

        .dashboard{
            display:flex;
            height:100vh;
        }

        /* SIDEBAR */

        .sidebar{
            width:110px;
            background:#bfc8f3;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:space-between;
            padding:30px 0;
            border-radius:0 30px 30px 0;
        }

        .sidebar-top{
            display:flex;
            flex-direction:column;
            gap:30px;
        }

        .logo{
            width:58px;
            height:58px;
            background:#5b47c5;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-size:22px;
            box-shadow:0 10px 20px rgba(91,71,197,0.3);
        }

        .menu-item{
            width:58px;
            height:58px;
            border-radius:18px;
            background:white;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#5b47c5;
            font-size:20px;
            transition:0.3s;
            cursor:pointer;
            text-decoration:none;
        }

        .menu-item.active{
            background:#5b47c5;
            color:white;
            box-shadow:0 10px 20px rgba(91,71,197,0.3);
        }

        .menu-item:hover{
            transform:translateY(-3px);
        }

        /* MAIN */

        .main{
            flex:1;
            padding:40px;
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:40px;
        }

        .title h1{
            font-size:42px;
            color:#202020;
        }

        .title p{
            color:#888;
            margin-top:8px;
            font-size:14px;
            letter-spacing:1px;
        }

        .project-select{
            background:white;
            padding:15px 25px;
            border-radius:14px;
            box-shadow:0 5px 15px rgba(0,0,0,0.05);
            color:#555;
        }

        /* CARDS */

        .cards{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:25px;
            margin-top:30px;
        }

        .card{
            background:white;
            padding:30px;
            border-radius:24px;
            box-shadow:0 10px 30px rgba(0,0,0,0.05);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .card-icon{
            width:50px;
            height:50px;
            border-radius:14px;
            display:flex;
            align-items:center;
            justify-content:center;
            margin-bottom:20px;
            font-size:20px;
        }

        .purple{
            background:#eee9ff;
            color:#5b47c5;
        }

        .green{
            background:#e6fff1;
            color:#19b36b;
        }

        .blue{
            background:#e9f3ff;
            color:#3498db;
        }

        .orange{
            background:#fff1e8;
            color:#ff914d;
        }

        .card h2{
            font-size:42px;
            margin-bottom:10px;
            color:#222;
        }

        .card p{
            color:#888;
            font-size:15px;
        }

        /* ACTION BUTTONS */

        .actions{
            margin-top:50px;
            display:flex;
            gap:25px;
        }

        .btn{
            flex:1;
            padding:22px;
            border:none;
            border-radius:20px;
            font-size:18px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
            text-decoration:none;
            text-align:center;
        }

        .medicine-btn{
            background:#5b47c5;
            color:white;
            box-shadow:0 10px 20px rgba(91,71,197,0.25);
        }

        .medicine-btn:hover{
            background:#4837a7;
            transform:translateY(-3px);
        }

        .logout-btn{
            background:white;
            color:#ff4d4d;
            border:2px solid #ffe0e0;
        }

        .admin-box{
            background:white;
            padding:15px 25px;
            border-radius:14px;
            box-shadow:0 5px 15px rgba(0,0,0,0.05);
            color:#555;
        }

        .logout-btn:hover{
            background:#ff4d4d;
            color:white;
        }

        /* RESPONSIVE */

        @media(max-width:1100px){

            .cards{
                grid-template-columns:repeat(2,1fr);
            }

        }

        @media(max-width:700px){

            .dashboard{
                flex-direction:column;
            }

            .sidebar{
                width:100%;
                height:90px;
                flex-direction:row;
                border-radius:0;
                padding:0 20px;
            }

            .sidebar-top{
                flex-direction:row;
            }

            .main{
                padding:20px;
            }

            .cards{
                grid-template-columns:1fr;
            }

            .actions{
                flex-direction:column;
            }

        }

    </style>
</head>
<body>

<div class="dashboard">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="sidebar-top">

            <div class="logo">
                <i class="fa-solid fa-prescription-bottle-medical"></i>
            </div>

            <div class="menu-item active">
                <i class="fa-solid fa-chart-line"></i>
            </div>

            <a href="/admin/medicines" class="menu-item">
                <i class="fa-solid fa-pills"></i>
            </a>

            <div class="menu-item">
                <i class="fa-solid fa-user-doctor"></i>
            </div>

            <div class="menu-item">
                <i class="fa-solid fa-file-medical"></i>
            </div>

        </div>

        <div class="menu-item">
            <i class="fa-solid fa-power-off"></i>
        </div>

    </div>

    <!-- MAIN CONTENT -->
    <div class="main">

        <div class="top-bar">

            <div class="title">
                <h1>Dashboard</h1>
                <p>PHARMACY MANAGEMENT SYSTEM</p>
            </div>

            <div class="admin-box">
                Admin Panel
            </div>

        </div>

        <!-- CARDS -->
        <div class="cards">

            <div class="card">
                <div class="card-icon purple">
                    <i class="fa-solid fa-capsules"></i>
                </div>

                <h2>125</h2>
                <p>Total Medicines</p>
            </div>

            <div class="card">
                <div class="card-icon green">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>

                <h2>58</h2>
                <p>Orders Today</p>
            </div>

            <div class="card">
                <div class="card-icon blue">
                    <i class="fa-solid fa-users"></i>
                </div>

                <h2>320</h2>
                <p>Total Customers</p>
            </div>

            <div class="card">
                <div class="card-icon orange">
                    <i class="fa-solid fa-money-bill-wave"></i>
                </div>

                <h2>$8.2K</h2>
                <p>Revenue</p>
            </div>

        </div>

        <!-- ACTION BUTTONS -->
        <div class="actions">

            <a href="/admin/medicines" class="btn medicine-btn">
                <i class="fa-solid fa-pills"></i>
                Medicine Management
            </a>

            <a href="/logout" class="btn logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </a>

        </div>

    </div>

</div>

</body>
</html>
