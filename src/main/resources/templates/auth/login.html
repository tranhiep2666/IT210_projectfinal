<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login</title>

    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-md-5">
            <div class="card shadow border-0 rounded-4">

                <div class="card-body p-5">

                    <h1 class="text-center mb-4 fw-bold">
                        Login
                    </h1>

                    <form th:action="@{/login}" method="post">

                        <!-- Username -->
                        <div class="mb-3">
                            <label class="form-label">
                                Username
                            </label>

                            <input type="text"
                                   name="username"
                                   th:value="${param.username}"
                                   th:classappend="${param.error != null && param.error[0] == 'username'} ? 'is-invalid' : ''"
                                   class="form-control form-control-lg"
                                   placeholder="Enter username">

                            <div class="invalid-feedback"
                                 th:if="${param.error != null && param.error[0] == 'username'}">
                                Username không tồn tại
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   name="password"
                                   th:classappend="${param.error != null && param.error[0] == 'password'} ? 'is-invalid' : ''"
                                   class="form-control form-control-lg"
                                   placeholder="Enter password">

                            <div class="invalid-feedback"
                                 th:if="${param.error != null && param.error[0] == 'password'}">
                                Password không đúng
                            </div>

                        </div>

                        <div class="d-grid">
                            <button type="submit"
                                    class="btn btn-primary btn-lg">
                                Login
                            </button>
                        </div>

                    </form>

                    <div class="text-center mt-4">
                        <span>
                            Don't have an account?
                        </span>

                        <a href="/auth/register"
                           class="text-decoration-none fw-semibold">
                            Register
                        </a>
                    </div>

                </div>

            </div>
        </div>

    </div>
</div>

</body>
</html>
