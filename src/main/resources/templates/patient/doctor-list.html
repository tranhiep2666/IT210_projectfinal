<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Select Doctor</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background:#eef1f8;
            min-height:100vh;
        }

        .dashboard{
            display:flex;
            min-height:100vh;
        }

        /* SIDEBAR */

        .sidebar{
            width:110px;
            background:#bfc8f3;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:space-between;
            padding:30px 0;
            border-radius:0 30px 30px 0;
        }

        .sidebar-top{
            display:flex;
            flex-direction:column;
            gap:30px;
        }

        .logo{
            width:58px;
            height:58px;
            background:#5b47c5;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-size:22px;
            box-shadow:0 10px 20px rgba(91,71,197,0.3);
        }

        .menu-item{
            width:58px;
            height:58px;
            border-radius:18px;
            background:white;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#5b47c5;
            font-size:20px;
            transition:0.3s;
            cursor:pointer;
            text-decoration:none;
        }

        .menu-item.active{
            background:#5b47c5;
            color:white;
            box-shadow:0 10px 20px rgba(91,71,197,0.3);
        }

        .menu-item:hover{
            transform:translateY(-3px);
        }

        /* MAIN */

        .main{
            flex:1;
            padding:40px;
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:35px;
        }

        .title h1{
            font-size:42px;
            color:#202020;
        }

        .title p{
            color:#888;
            margin-top:8px;
            font-size:14px;
            letter-spacing:1px;
        }

        .patient-box{
            background:white;
            padding:15px 25px;
            border-radius:14px;
            box-shadow:0 5px 15px rgba(0,0,0,0.05);
            color:#555;
        }

        /* DOCTOR CARD */

        .doctor-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(420px,1fr));
            gap:30px;
        }

        .doctor-card{
            background:white;
            border-radius:28px;
            padding:35px;
            box-shadow:0 10px 30px rgba(0,0,0,0.05);
            transition:0.3s;
        }

        .doctor-card:hover{
            transform:translateY(-5px);
        }

        .doctor-header{
            display:flex;
            align-items:center;
            gap:20px;
            margin-bottom:30px;
        }

        .doctor-avatar{
            width:75px;
            height:75px;
            border-radius:22px;
            background:#eee9ff;
            color:#5b47c5;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:30px;
        }

        .doctor-info h2{
            color:#222;
            margin-bottom:6px;
        }

        .doctor-info p{
            color:#777;
            font-size:14px;
        }

        /* FORM */

        label{
            display:block;
            margin-bottom:10px;
            color:#444;
            font-weight:600;
        }

        input{
            width:100%;
            padding:14px;
            border-radius:14px;
            border:1px solid #ddd;
            margin-bottom:20px;
            font-size:15px;
            outline:none;
            transition:0.3s;
        }

        input:focus{
            border-color:#5b47c5;
            box-shadow:0 0 0 4px rgba(91,71,197,0.1);
        }

        .book-btn{
            width:100%;
            border:none;
            padding:16px;
            border-radius:16px;
            background:#5b47c5;
            color:white;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
            box-shadow:0 10px 20px rgba(91,71,197,0.25);
        }

        .book-btn:hover{
            background:#4837a7;
            transform:translateY(-2px);
        }

        /* RESPONSIVE */

        @media(max-width:950px){

            .dashboard{
                flex-direction:column;
            }

            .sidebar{
                width:100%;
                height:90px;
                flex-direction:row;
                border-radius:0;
                padding:0 20px;
            }

            .sidebar-top{
                flex-direction:row;
            }

            .main{
                padding:20px;
            }

            .doctor-grid{
                grid-template-columns:1fr;
            }

        }

    </style>

</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="sidebar-top">

            <div class="logo">
                <i class="fa-solid fa-heart-pulse"></i>
            </div>

            <a href="/patient/dashboard"
               class="menu-item">

                <i class="fa-solid fa-house"></i>

            </a>

            <a href="/patient/booking"
               class="menu-item active">

                <i class="fa-solid fa-calendar-check"></i>

            </a>

            <a href="/patient/appointments"
               class="menu-item">

                <i class="fa-solid fa-clock-rotate-left"></i>

            </a>

            <a href="/patient/history"
               class="menu-item">

                <i class="fa-solid fa-file-medical"></i>

            </a>

        </div>

        <a href="/logout"
           class="menu-item">

            <i class="fa-solid fa-right-from-bracket"></i>

        </a>

    </div>

    <!-- MAIN -->

    <div class="main">

        <div class="top-bar">

            <div class="title">

                <h1>
                    Select Doctor
                </h1>

                <p>
                    BOOK YOUR APPOINTMENT
                </p>

            </div>

            <div class="patient-box">
                Patient Panel
            </div>

        </div>

        <!-- DOCTOR LIST -->

        <div class="doctor-grid">

            <div class="doctor-card"
                 th:each="d : ${doctors}">

                <div class="doctor-header">

                    <div class="doctor-avatar">
                        <i class="fa-solid fa-user-doctor"></i>
                    </div>

                    <div class="doctor-info">

                        <h2 th:text="${d.user.username}">
                        </h2>

                        <p>
                            Specialist Doctor
                        </p>

                    </div>

                </div>

                <!-- BOOKING FORM -->

                <form th:action="@{/patient/appointments/book}"
                      method="post">

                    <input type="hidden"
                           name="doctorId"
                           th:value="${d.id}">

                    <label>
                        Appointment Date
                    </label>

                    <input type="date"
                           name="appointmentDate"
                           required>

                    <label>
                        Appointment Time
                    </label>

                    <input type="time"
                           name="appointmentTime"
                           required>

                    <label>
                        Reason
                    </label>

                    <input type="text"
                           name="reason"
                           placeholder="Enter medical reason"
                           required>

                    <button type="submit"
                            class="book-btn">

                        <i class="fa-solid fa-calendar-plus"></i>
                        Book Appointment

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
