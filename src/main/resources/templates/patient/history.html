<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Medical History</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background:#eef1f8;
            min-height:100vh;
        }

        .dashboard{
            display:flex;
            min-height:100vh;
        }

        /* SIDEBAR */

        .sidebar{
            width:110px;
            background:#bfc8f3;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:space-between;
            padding:30px 0;
            border-radius:0 30px 30px 0;
        }

        .sidebar-top{
            display:flex;
            flex-direction:column;
            gap:30px;
        }

        .logo{
            width:58px;
            height:58px;
            background:#5b47c5;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-size:22px;
            box-shadow:0 10px 20px rgba(91,71,197,0.3);
        }

        .menu-item{
            width:58px;
            height:58px;
            border-radius:18px;
            background:white;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#5b47c5;
            font-size:20px;
            transition:0.3s;
            cursor:pointer;
            text-decoration:none;
        }

        .menu-item.active{
            background:#5b47c5;
            color:white;
            box-shadow:0 10px 20px rgba(91,71,197,0.3);
        }

        .menu-item:hover{
            transform:translateY(-3px);
        }

        /* MAIN */

        .main{
            flex:1;
            padding:40px;
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:35px;
        }

        .title h1{
            font-size:42px;
            color:#202020;
        }

        .title p{
            color:#888;
            margin-top:8px;
            font-size:14px;
            letter-spacing:1px;
        }

        .patient-box{
            background:white;
            padding:15px 25px;
            border-radius:14px;
            box-shadow:0 5px 15px rgba(0,0,0,0.05);
            color:#555;
        }

        /* HISTORY CARD */

        .history-card{
            background:white;
            border-radius:24px;
            padding:30px;
            margin-bottom:30px;
            box-shadow:0 10px 30px rgba(0,0,0,0.05);
        }

        .history-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:25px;
        }

        .history-header h2{
            color:#5b47c5;
            font-size:28px;
        }

        .status{
            padding:10px 18px;
            border-radius:30px;
            font-size:13px;
            font-weight:600;
        }

        .pending{
            background:#fff4df;
            color:#ff9800;
        }

        .confirmed{
            background:#e9f3ff;
            color:#3498db;
        }

        .completed{
            background:#e6fff1;
            color:#19b36b;
        }

        .cancelled{
            background:#ffe8e8;
            color:#d62828;
        }

        /* INFO */

        .info-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
            gap:20px;
            margin-bottom:25px;
        }

        .info-box{
            background:#f8f7ff;
            border-radius:18px;
            padding:20px;
        }

        .info-box h4{
            color:#777;
            font-size:14px;
            margin-bottom:8px;
        }

        .info-box p{
            color:#222;
            font-size:16px;
            font-weight:600;
        }

        /* MEDICAL RECORD */

        .record-box{
            background:#fafaff;
            border:1px solid #ecebff;
            border-radius:20px;
            padding:25px;
            margin-top:25px;
        }

        .record-title{
            display:flex;
            align-items:center;
            gap:12px;
            margin-bottom:20px;
        }

        .record-icon{
            width:45px;
            height:45px;
            border-radius:14px;
            background:#eee9ff;
            color:#5b47c5;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .record-title h3{
            color:#5b47c5;
        }

        .record-item{
            margin-bottom:18px;
        }

        .record-item strong{
            display:block;
            margin-bottom:8px;
            color:#444;
        }

        .record-item span{
            color:#666;
            line-height:1.6;
        }

        /* PRESCRIPTION */

        .prescription{
            margin-top:30px;
            background:white;
            border-radius:18px;
            padding:25px;
            border:1px solid #f0f0f0;
        }

        .prescription h3{
            margin-bottom:20px;
            color:#5b47c5;
        }

        .medicine-item{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:15px 0;
            border-bottom:1px solid #f1f1f1;
        }

        .medicine-item:last-child{
            border-bottom:none;
        }

        .medicine-name{
            font-weight:600;
            color:#222;
        }

        .medicine-qty{
            color:#666;
        }

        /* RESPONSIVE */

        @media(max-width:900px){

            .dashboard{
                flex-direction:column;
            }

            .sidebar{
                width:100%;
                height:90px;
                flex-direction:row;
                border-radius:0;
                padding:0 20px;
            }

            .sidebar-top{
                flex-direction:row;
            }

            .main{
                padding:20px;
            }

            .history-header{
                flex-direction:column;
                align-items:flex-start;
                gap:15px;
            }

        }

    </style>

</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="sidebar-top">

            <div class="logo">
                <i class="fa-solid fa-heart-pulse"></i>
            </div>

            <a href="/patient/dashboard"
               class="menu-item">

                <i class="fa-solid fa-house"></i>

            </a>

            <a href="/patient/booking"
               class="menu-item">

                <i class="fa-solid fa-calendar-check"></i>

            </a>

            <a href="/patient/appointments"
               class="menu-item">

                <i class="fa-solid fa-clock-rotate-left"></i>

            </a>

            <a href="/patient/history"
               class="menu-item active">

                <i class="fa-solid fa-file-medical"></i>

            </a>

        </div>

        <a href="/logout"
           class="menu-item">

            <i class="fa-solid fa-right-from-bracket"></i>

        </a>

    </div>

    <!-- MAIN -->

    <div class="main">

        <div class="top-bar">

            <div class="title">

                <h1>
                    Medical History
                </h1>

                <p>
                    SMART HEALTHCARE SYSTEM
                </p>

            </div>

            <div class="patient-box">
                Patient Panel
            </div>

        </div>

        <!-- HISTORY -->

        <div class="history-card"
             th:each="a : ${appointments}">

            <div class="history-header">

                <h2>

                    Appointment #
                    <span th:text="${a.id}"></span>

                </h2>

                <div>

                    <span th:if="${a.status.name() == 'PENDING'}"
                          class="status pending">

                        Pending

                    </span>

                    <span th:if="${a.status.name() == 'CONFIRMED'}"
                          class="status confirmed">

                        Confirmed

                    </span>

                    <span th:if="${a.status.name() == 'COMPLETED'}"
                          class="status completed">

                        Completed

                    </span>

                    <span th:if="${a.status.name() == 'CANCELLED'}"
                          class="status cancelled">

                        Cancelled

                    </span>

                </div>

            </div>

            <!-- APPOINTMENT INFO -->

            <div class="info-grid">

                <div class="info-box">

                    <h4>
                        Doctor
                    </h4>

                    <p th:text="${a.doctor.user.username}">
                    </p>

                </div>

                <div class="info-box">

                    <h4>
                        Appointment Date
                    </h4>

                    <p th:text="${a.appointmentDate}">
                    </p>

                </div>

            </div>

            <!-- MEDICAL RECORD -->

            <div th:if="${a.medicalRecords != null and !a.medicalRecords.isEmpty()}">

                <div class="record-box"
                     th:each="mr : ${a.medicalRecords}">

                    <div class="record-title">

                        <div class="record-icon">
                            <i class="fa-solid fa-stethoscope"></i>
                        </div>

                        <h3>
                            Medical Examination
                        </h3>

                    </div>

                    <div class="record-item">

                        <strong>
                            Symptoms
                        </strong>

                        <span th:text="${mr.symptoms}">
                        </span>

                    </div>

                    <div class="record-item">

                        <strong>
                            Diagnosis
                        </strong>

                        <span th:text="${mr.diagnosis}">
                        </span>

                    </div>

                    <div class="record-item">

                        <strong>
                            Notes
                        </strong>

                        <span th:text="${mr.notes}">
                        </span>

                    </div>

                    <!-- PRESCRIPTION -->

                    <div class="prescription"
                         th:if="${mr.prescription != null}">

                        <h3>
                            <i class="fa-solid fa-pills"></i>
                            Prescription
                        </h3>

                        <div class="medicine-item"
                             th:each="d : ${mr.prescription.details}">

                            <div>

                                <div class="medicine-name"
                                     th:text="${d.medicine.name}">
                                </div>

                            </div>

                            <div class="medicine-qty">

                                Quantity:
                                <span th:text="${d.quantity}"></span>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
