<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Medicine</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }
        body{
            background:#eef1f8;
            min-height:100vh;
        }
        .dashboard{
            display:flex;
            min-height:100vh;
        }
        .sidebar{
            width:110px;
            background:#bfc8f3;
            display:flex;
            flex-direction:column;
            justify-content:space-between;
            align-items:center;
            padding:30px 0;
            border-radius:0 30px 30px 0;
        }
        .sidebar-top{
            display:flex;
            flex-direction:column;
            gap:30px;
        }
        .logo{
            width:58px;
            height:58px;
            border-radius:50%;
            background:#5b47c5;
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-size:22px;
            box-shadow:0 10px 20px rgba(91,71,197,0.3);
        }
        .menu-item{
            width:58px;
            height:58px;
            border-radius:18px;
            background:white;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#5b47c5;
            font-size:20px;
            transition:0.3s;
            cursor:pointer;
            text-decoration:none;
        }
        .menu-item.active{
            background:#5b47c5;
            color:white;
            box-shadow:0 10px 20px rgba(91,71,197,0.3);
        }
        .menu-item:hover{
            transform:translateY(-3px);
        }
        .main{
            flex:1;
            padding:40px;
        }
        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:40px;
        }
        .title h1{
            font-size:42px;
            color:#222;
        }
        .title p{
            color:#888;
            margin-top:8px;
            letter-spacing:1px;
            font-size:14px;
        }
        .admin-box{
            background:white;
            padding:15px 25px;
            border-radius:14px;
            box-shadow:0 5px 15px rgba(0,0,0,0.05);
            color:#555;
        }
        .form-card{
            max-width:700px;
            background:white;
            padding:40px;
            border-radius:28px;
            box-shadow:0 15px 35px rgba(0,0,0,0.05);
        }
        .form-card h2{
            margin-bottom:30px;
            color:#222;
            font-size:30px;
        }
        .form-group{
            margin-bottom:25px;
        }
        .form-group label{
            display:block;
            margin-bottom:10px;
            color:#555;
            font-weight:500;
        }
        .form-group input{
            width:100%;
            padding:16px 18px;
            border:none;
            border-radius:16px;
            background:#f4f6fb;
            font-size:16px;
            transition:0.3s;
        }
        .form-group input:focus{
            outline:none;
            border:2px solid #5b47c5;
            background:white;
        }
        .submit-btn{
            width:100%;
            padding:18px;
            border:none;
            border-radius:18px;
            background:#5b47c5;
            color:white;
            font-size:18px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
            box-shadow:0 10px 20px rgba(91,71,197,0.25);
        }
        .submit-btn:hover{
            background:#4837a7;
            transform:translateY(-2px);
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="sidebar">
        <div class="sidebar-top">
            <div class="logo">
                <i class="fa-solid fa-prescription-bottle-medical"></i>
            </div>
            <a href="/admin" class="menu-item">
                <i class="fa-solid fa-chart-line"></i>
            </a>
            <a href="/admin/medicines" class="menu-item active">
                <i class="fa-solid fa-pills"></i>
            </a>
            <a href="#" class="menu-item">
                <i class="fa-solid fa-users"></i>
            </a>
            <a href="#" class="menu-item">
                <i class="fa-solid fa-file-medical"></i>
            </a>
        </div>
        <a href="/logout" class="menu-item">
            <i class="fa-solid fa-right-from-bracket"></i>
        </a>
    </div>
    <div class="main">
        <div class="top-bar">
            <div class="title">
                <h1>Create Medicine</h1>
                <p>PHARMACY MANAGEMENT SYSTEM</p>
            </div>
            <div class="admin-box">
                Admin Panel
            </div>
        </div>
        <div class="form-card">
            <h2>Add New Medicine</h2>
            <form th:action="@{/admin/medicines/create}"
                  method="post"
                  th:object="${medicine}">
                <div class="form-group">
                    <label>Medicine Name</label>
                    <input type="text"
                           th:field="*{name}"
                           placeholder="Enter medicine name"
                            required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text"
                           th:field="*{description}"
                           placeholder="Enter description"
                    required>
                </div>
                <div class="form-group">
                    <label>Stock Quantity</label>
                    <input type="number"
                           th:field="*{stockQuantity}"
                           placeholder="Enter stock quantity" required>
                </div>
                <div class="form-group">
                    <label>Price</label>
                    <input type="number"
                           step="0.01"
                           th:field="*{price}"
                           placeholder="Enter price" required>
                </div>
                <button type="submit" class="submit-btn">
                    <i class="fa-solid fa-plus"></i>
                    Create Medicine
                </button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
