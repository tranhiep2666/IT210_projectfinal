<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Medicine</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background:#eef1f8;
            min-height:100vh;
            overflow-x:hidden;
        }

        .dashboard{
            display:flex;
            min-height:100vh;
        }

        /* SIDEBAR */

        .sidebar{
            width:110px;
            background:#bfc8f3;
            display:flex;
            flex-direction:column;
            justify-content:space-between;
            align-items:center;
            padding:30px 0;
            border-radius:0 30px 30px 0;
        }

        .sidebar-top{
            display:flex;
            flex-direction:column;
            gap:30px;
            margin-bottom: 30px;
        }

        .logo{
            width:58px;
            height:58px;
            border-radius:50%;
            background:#5b47c5;
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-size:22px;
            box-shadow:0 10px 20px rgba(91,71,197,0.3);
        }

        .menu-item{
            width:58px;
            height:58px;
            border-radius:18px;
            background:white;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#5b47c5;
            font-size:20px;
            transition:0.3s;
            cursor:pointer;
            text-decoration:none;
        }

        .menu-item.active{
            background:#5b47c5;
            color:white;
            box-shadow:0 10px 20px rgba(91,71,197,0.3);
        }

        .menu-item:hover{
            transform:translateY(-3px);
        }

        /* MAIN */

        .main{
            flex:1;
            padding:40px;
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:40px;
        }

        .title h1{
            font-size:42px;
            color:#202020;
        }

        .title p{
            color:#888;
            margin-top:8px;
            font-size:14px;
            letter-spacing:1px;
        }

        .admin-box{
            background:white;
            padding:15px 25px;
            border-radius:14px;
            box-shadow:0 5px 15px rgba(0,0,0,0.05);
            color:#555;
        }

        /* FORM CARD */

        .form-card{
            background:white;
            border-radius:30px;
            padding:40px;
            box-shadow:0 10px 30px rgba(0,0,0,0.05);
            max-width:850px;
        }

        .form-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:25px;
        }

        .form-group{
            display:flex;
            flex-direction:column;
        }

        .full-width{
            grid-column:1 / -1;
        }

        label{
            margin-bottom:10px;
            color:#444;
            font-size:15px;
            font-weight:500;
        }

        input{
            border:none;
            background:#f7f8fc;
            padding:16px;
            border-radius:16px;
            font-size:15px;
            outline:none;
            transition:0.3s;
        }

        input:focus{
            box-shadow:0 0 0 3px rgba(91,71,197,0.15);
        }

        .input-icon{
            position:relative;
        }

        .input-icon i{
            position:absolute;
            left:18px;
            top:50%;
            transform:translateY(-50%);
            color:#777;
        }

        .input-icon input{
            padding-left:48px;
        }

        /* BUTTONS */

        .actions{
            display:flex;
            gap:20px;
            margin-top:35px;
        }

        .btn{
            flex:1;
            border:none;
            padding:18px;
            border-radius:18px;
            font-size:15px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
            text-decoration:none;
            text-align:center;
        }

        .update-btn{
            background:#5b47c5;
            color:white;
            box-shadow:0 10px 20px rgba(91,71,197,0.25);
        }

        .update-btn:hover{
            background:#4837a7;
            transform:translateY(-2px);
        }

        .cancel-btn{
            background:white;
            color:#ff4d4d;
            border:2px solid #ffe0e0;
        }

        .cancel-btn:hover{
            background:#ff4d4d;
            color:white;
        }

        /* RESPONSIVE */

        @media(max-width:850px){

            .form-grid{
                grid-template-columns:1fr;
            }

        }

        @media(max-width:700px){

            .main{
                padding:20px;
            }

            .actions{
                flex-direction:column;
            }

        }

    </style>

</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->

    <div th:replace="~{fragments/admin-sidebar :: adminSidebar('medicine')}">
    </div>

    <!-- MAIN -->

    <div class="main">

        <div class="top-bar">

            <div class="title">

                <h1>
                    Edit Medicine
                </h1>

                <p>
                    UPDATE MEDICINE INFORMATION
                </p>

            </div>

            <div class="admin-box">
                Admin Panel
            </div>

        </div>

        <!-- FORM -->

        <div class="form-card">

            <form th:action="@{'/admin/medicines/edit/' + ${medicine.id}}"
                  method="post">

                <div class="form-grid">

                    <!-- NAME -->

                    <div class="form-group">

                        <label>
                            Medicine Name
                        </label>

                        <div class="input-icon">

                            <i class="fa-solid fa-capsules"></i>

                            <input type="text"
                                   name="name"
                                   th:value="${medicine.name}"
                                   required>

                        </div>

                    </div>

                    <!-- STOCK -->

                    <div class="form-group">

                        <label>
                            Stock Quantity
                        </label>

                        <div class="input-icon">

                            <i class="fa-solid fa-boxes-stacked"></i>

                            <input type="number"
                                   name="stockQuantity"
                                   th:value="${medicine.stockQuantity}"
                                   required>

                        </div>

                    </div>

                    <!-- DESCRIPTION -->

                    <div class="form-group full-width">

                        <label>
                            Description
                        </label>

                        <div class="input-icon">

                            <i class="fa-solid fa-file-medical"></i>

                            <input type="text"
                                   name="description"
                                   th:value="${medicine.description}">

                        </div>

                    </div>

                    <!-- PRICE -->

                    <div class="form-group">

                        <label>
                            Price
                        </label>

                        <div class="input-icon">

                            <i class="fa-solid fa-money-bill-wave"></i>

                            <input type="number"
                                   step="0.01"
                                   name="price"
                                   th:value="${medicine.price}"
                                   required>

                        </div>

                    </div>

                </div>

                <!-- ACTIONS -->

                <div class="actions">
                    <button type="submit"
                            class="btn update-btn">
                        <i class="fa-solid fa-floppy-disk"></i>
                        Update Medicine
                    </button>
                    <a href="/admin/medicines"
                       class="btn cancel-btn">
                        <i class="fa-solid fa-arrow-left"></i>
                        Back
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
